name: Fork builds

# Builds the fork's packages: a portable Windows zip (no installer, all state in a data\ folder next to
# HelixNotes.exe) and Linux .deb and AppImage packages. Every run (pushes to main, pull requests, manual
# runs) uploads them as workflow artifacts; a fork-v* tag also publishes them all in one GitHub release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["fork-v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: fork-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # pnpm is enabled in the next step, so setup-node cannot cache it yet.
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # HELIXNOTES_INSTALL_TYPE=portable makes this exe portable even without a marker file,
      # and turns off the in-app updater. The fork config drops updater signing.
      - name: Build portable exe
        env:
          HELIXNOTES_INSTALL_TYPE: portable
        run: pnpm tauri build --no-bundle --config src-tauri/tauri.fork.conf.json

      # Starts the exe from a scratch folder and checks that it stays up, writes its webview data
      # into data\ and leaves AppData alone.
      - name: Smoke test portable exe
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "portable-smoke"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item src-tauri/target/release/helixnotes.exe "$dir/HelixNotes.exe"
          $appData = @(
            (Join-Path $env:APPDATA "helixnotes"),
            (Join-Path $env:APPDATA "com.helixnotes.app"),
            (Join-Path $env:LOCALAPPDATA "helixnotes"),
            (Join-Path $env:LOCALAPPDATA "com.helixnotes.app")
          )
          $app = Start-Process -FilePath "$dir/HelixNotes.exe" -WorkingDirectory $dir -PassThru
          $webview = Join-Path $dir "data/webview"
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not $app.HasExited) {
            if ((Test-Path $webview) -and (Get-ChildItem $webview -Recurse -File | Select-Object -First 1)) { break }
            Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 5
          $failures = @()
          if ($app.HasExited) { $failures += "HelixNotes.exe exited early with code $($app.ExitCode)" }
          if (-not (Test-Path $webview) -or -not (Get-ChildItem $webview -Recurse -File | Select-Object -First 1)) {
            $failures += "No webview data under $webview"
          }
          foreach ($path in $appData) {
            if (Test-Path $path) { $failures += "Portable exe wrote to $path" }
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-ChildItem $dir -Recurse -Depth 2 | Select-Object -ExpandProperty FullName
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ -ErrorAction Continue }
            exit 1
          }
          Write-Host "Portable exe started and kept its data in $dir\data"

      - name: Package zip
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "HelixNotes_${version}_windows_x64_portable"
          $dir = "dist-portable/HelixNotes"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item src-tauri/target/release/helixnotes.exe "$dir/HelixNotes.exe"
          Copy-Item packaging/windows-portable/README.txt "$dir/README.txt"
          Compress-Archive -Path $dir -DestinationPath "dist-portable/$name.zip" -Force
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist-portable/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  linux:
    # The oldest supported runner, so the packages link against an older glibc and run on more distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config patchelf \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # pnpm is enabled in the next step, so setup-node cannot cache it yet.
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds with HELIXNOTES_INSTALL_TYPE=fork (no in-app updater) and without updater signing.
      # APPIMAGE_EXTRACT_AND_RUN lets linuxdeploy run without FUSE on the runner.
      - name: Build .deb and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm fork:build:linux

      - name: Collect packages
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist-linux
          cp src-tauri/target/release/bundle/deb/*.deb dist-linux/
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/
          ls -l dist-linux
          echo "name=HelixNotes_${version}_linux_x64" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist-linux/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/fork-v')
    needs: [windows-portable, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
