name: Windows portable build

# Builds HelixNotes.exe as a portable app: no installer, all state in a data\ folder next to it.
# Every run (pushes to main, pull requests, manual runs) uploads the zip as a workflow artifact; a fork-v* tag also publishes it as a release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["fork-v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # HELIXNOTES_INSTALL_TYPE=portable makes this exe portable even without a marker file,
      # and turns off the in-app updater. The fork config drops updater signing.
      - name: Build portable exe
        env:
          HELIXNOTES_INSTALL_TYPE: portable
        run: pnpm tauri build --no-bundle --config src-tauri/tauri.fork.conf.json

      - name: Package zip
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "HelixNotes_${version}_windows_x64_portable"
          $dir = "dist-portable/HelixNotes"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item src-tauri/target/release/helixnotes.exe "$dir/HelixNotes.exe"
          Copy-Item packaging/windows-portable/README.txt "$dir/README.txt"
          Compress-Archive -Path $dir -DestinationPath "dist-portable/$name.zip" -Force
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist-portable/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/fork-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "dist-portable/${{ steps.package.outputs.name }}.zip"
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $zip --clobber
          } else {
            gh release create "${{ github.ref_name }}" $zip --title "${{ github.ref_name }}" --generate-notes
          }
